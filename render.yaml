services:
  - type: web
    name: focusflow-back
    env: docker
    rootDir: back
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: focusflow-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: focusflow-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: focusflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: focusflow-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: focusflow-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: focusflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: focusflow-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false

databases:
  - name: focusflow-db
    plan: free